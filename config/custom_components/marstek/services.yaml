charge:
  name: 充电
  description: 以手动模式全天充电，负功率代表充电。
  fields:
    host:
      name: 设备IP
      description: 目标设备的 IP 地址，例如 192.168.3.91
      example: 192.168.3.91
      required: true
      selector:
        text:
    power:
      name: 功率(W)
      description: 充电功率（负数为充电），默认 -1300。
      example: -1300
      required: false
      selector:
        number:
          min: -3000
          max: 0
          step: 100

discharge:
  name: 放电
  description: 以手动模式全天放电，正功率代表放电。
  fields:
    host:
      name: 设备IP
      description: 目标设备的 IP 地址，例如 192.168.3.91
      example: 192.168.3.91
      required: true
      selector:
        text:
    power:
      name: 功率(W)
      description: 放电功率（正数为放电），默认 1300。
      example: 1300
      required: false
      selector:
        number:
          min: 0
          max: 3000
          step: 100

stop:
  name: 停止充放电
  description: 手动模式下将 enable 置 0。
  fields:
    host:
      name: 设备IP
      description: 目标设备的 IP 地址，例如 192.168.3.91
      example: 192.168.3.91
      required: true
      selector:
        text:
