# Marstek 设备卡片配置
# 使用方法：在 Lovelace 编辑器中添加 "手动卡片" -> "YAML" -> 复制下面的配置

# 设备1卡片 (192.168.3.91)
- type: vertical-stack
  title: "Marstek 设备 1 (192.168.3.91)"
  cards:
    - type: gauge
      entity: sensor.marstek_battery_level_192_168_3_91
      name: "电池电量"
      unit: "%"
      min: 0
      max: 100
      severity:
        green: 50
        yellow: 20
        red: 0
      needle: true
    - type: gauge
      entity: sensor.marstek_battery_power_192_168_3_91
      name: "电池功率"
      unit: "W"
      min: -100
      max: 100
      needle: true
    - type: entities
      title: "设备信息"
      entities:
        - sensor.marstek_device_ip_192_168_3_91
        - sensor.marstek_device_version_192_168_3_91

