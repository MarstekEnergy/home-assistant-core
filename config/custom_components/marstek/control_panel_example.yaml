# Marstek 设备控制面板示例
# 这是一个完整的控制界面配置

- type: vertical-stack
  title: "🔋 Marstek 设备控制面板 (192.168.3.91)"
  cards:
    # 状态显示区域
    - type: entities
      title: "📊 当前状态"
      entities:
        - sensor.marstek_battery_level_3
        - sensor.marstek_battery_power_3
        - sensor.marstek_device_mode
        - sensor.marstek_battery_status
    
    # 模式选择
    - type: entities
      title: "⚙️ 运行模式"
      entities:
        - select.marstek_device_mode_3
    
    # 功率控制
    - type: entities
      title: "⚡ 功率控制"
      entities:
        - number.marstek_charge_power_3
        - number.marstek_discharge_power_3
        - number.marstek_target_soc_3
    
    # 开关控制
    - type: entities
      title: "🔌 充放电控制"
      entities:
        - switch.marstek_charge_enable_3
        - switch.marstek_discharge_enable_3
        - switch.marstek_auto_mode_3
    
    # 快捷操作
    - type: entities
      title: "🚀 快捷操作"
      entities:
        - button.marstek_stop_all_3
        - button.marstek_max_charge_3
        - button.marstek_max_discharge_3
        - button.marstek_emergency_stop_3
