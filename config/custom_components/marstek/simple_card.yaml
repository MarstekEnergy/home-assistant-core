# 多设备的 Marstek 卡片示例（可直接粘贴到 Lovelace 原始配置编辑器）
# 使用方法：
# 1) 复制整段到你的仪表板的“原始配置编辑器”。
# 2) 将下面的占位符实体ID替换为你设备真实的实体ID（到 设置→设备与服务→设备→实体 复制）。
#    - 占位符示例：sensor.marstek_battery_level_DEV_A 需改成你实际的电量实体ID。
# 3) 如需更多设备，复制一个 vertical-stack 区块，修改标题与实体ID。

- type: grid
  columns: 2
  square: false
  cards:
    # ===================== 设备 A（示例：192.168.3.76） =====================
    - type: vertical-stack
      title: "🔋 Marstek (192.168.3.76)"
      cards:
        # 电量
        - type: gauge
          entity: sensor.marstek_battery_level_DEV_A   # 替换为设备A的电量实体ID
          name: "电池电量"
          unit: "%"
          min: 0
          max: 100
          severity:
            green: 50
            yellow: 20
            red: 0
          needle: true
        # 并网功率
        - type: gauge
          entity: sensor.marstek_grid_power_DEV_A      # 替换为设备A的功率实体ID
          name: "电网功率"
          unit: "W"
          min: 0
          max: 3000
          needle: true
        # 信息列表
        - type: entities
          title: "📱 设备信息"
          entities:
            - entity: sensor.marstek_device_mode_192_168_3_76   # 替换为设备A的模式实体ID
              name: 运行模式
            - entity: sensor.marstek_battery_status_192_168_3_76 # 替换为设备A的电池状态实体ID
              name: 电池状态
            - entity: sensor.marstek_device_ip_192_168_3_76      # 替换为设备A的设备IP实体ID
              name: 设备IP
            - entity: sensor.marstek_device_version_192_168_3_76 # 替换为设备A的固件版本实体ID
              name: 固件版本

    # ===================== 设备 B（示例：192.168.3.91） =====================
    - type: vertical-stack
      title: "🔋 Marstek (192.168.3.91)"
      cards:
        - type: gauge
          entity: sensor.marstek_battery_level_DEV_B   # 替换为设备B的电量实体ID
          name: "电池电量"
          unit: "%"
          min: 0
          max: 100
          severity:
            green: 50
            yellow: 20
            red: 0
          needle: true
        - type: gauge
          entity: sensor.marstek_grid_power_DEV_B      # 替换为设备B的功率实体ID
          name: "电网功率"
          unit: "W"
          min: 0
          max: 3000
          needle: true
        - type: entities
          title: "📱 设备信息"
          entities:
            - entity: sensor.marstek_device_mode_192_168_3_91   # 替换为设备B的模式实体ID
              name: 运行模式
            - entity: sensor.marstek_battery_status_192_168_3_91 # 替换为设备B的电池状态实体ID
              name: 电池状态
            - entity: sensor.marstek_device_ip_192_168_3_91      # 替换为设备B的设备IP实体ID
              name: 设备IP
            - entity: sensor.marstek_device_version_192_168_3_91 # 替换为设备B的固件版本实体ID
              name: 固件版本
